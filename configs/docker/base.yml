services:
    nginx:
        image: nginx:1.29.3-alpine
        restart: unless-stopped
        ports:
            - ${WEBSITE_PORT}:6600
        volumes:
            - ../nginx:/etc/nginx/templates
    api:
        build:
            context: ../..
            dockerfile: configs/docker/Dockerfile
            target: api
            args:
                NODE_IMAGE: node:22.19.0-alpine
        restart: unless-stopped
        environment:
            MESSAGE: ${MESSAGE}
